<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Renvo WebAssembly compiler</title>
  <style>
    :root { color-scheme: dark; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
    body { max-width: 1100px; margin: 0 auto; padding: 24px; background: #12151a; color: #e8e8e8; }
    h1 { margin: 0 0 8px; font: 600 24px system-ui, sans-serif; }
    p { color: #aeb7c4; }
    label { display: block; margin: 16px 0 6px; color: #cbd3de; }
    input, textarea, button { box-sizing: border-box; border: 1px solid #46505e; border-radius: 5px; background: #1b2028; color: inherit; font: inherit; }
    input, textarea { width: 100%; padding: 10px; }
    textarea { min-height: 360px; resize: vertical; tab-size: 4; }
    button { margin-top: 14px; padding: 10px 18px; background: #2563a9; border-color: #397bc5; cursor: pointer; }
    button:disabled { opacity: .55; cursor: wait; }
    pre { min-height: 56px; padding: 12px; overflow: auto; background: #090b0e; border-radius: 5px; white-space: pre-wrap; }
    #outputs a { display: inline-block; margin: 0 12px 8px 0; color: #7cc4ff; }
  </style>
</head>
<body>
  <h1>Renvo compiler</h1>
  <p>The WASI-only frontend and backend run in a dedicated worker. The frontend emits a canonical unit, then the separately JIT-compiled backend turns it into a command-line WebAssembly app.</p>
  <label for="command">Compiler arguments</label>
  <input id="command" value="-s -o app.wasm ." spellcheck="false">
  <label for="source">main.go</label>
  <textarea id="source" spellcheck="false">package main

func main() {
	print("Hello from Renvo!\n")
}
</textarea>
  <button id="compile" disabled>Loading compiler…</button>
  <label>Diagnostics</label>
  <pre id="diagnostics" aria-live="polite"></pre>
  <div id="outputs"></div>
  <script type="module" src="app.mjs"></script>
</body>
</html>
