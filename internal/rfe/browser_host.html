// Worker-owned compiled RFE arenas. The only accepted service path is the
// fixed runtime device; code and call arguments remain bounded and local.
// Quiescent transfer: no compilation, no executable cache outside the
// original cap, and no dispatcher (which captures an arena table) is retained.
function recycleJIT(f,packet){

 const v=new DataView(packet.buffer,packet.byteOffset,packet.byteLength),arena=f.jit,owner=v.getUint32(4,true),count=v.getUint32(8,true);
 if(!arena||!arena.retired||owner===0||arena.retiredOwner!==owner||!gateModule||count>8191||packet.length!==12+count*4)return -1;

 // unchanged code and its exact same-entry immutable admission record. Old gate functions have a different immutable owner and

 const fresh={capacity:arena.capacity,bytes:retained,next:16,blocks:new Map(),table:arena.table,metadata:arena.metadata};
 for(let i=0;i<32768;i++)fresh.table.set(i,null);
 new Uint8Array(fresh.metadata.buffer).fill(0);
 for(let i=0;i<count;i++){

function jitRequest(f,parts){

 // code runs. Installation packets still own a copy through module validation.

  if(!arena||arena.retired||words<1||words>256||flags>1||contextSize<64||contextSize>1048576||arena.next>=16384*16||arena.bytes+code.length>arena.capacity)throw Error("RFE JIT arena budget exceeded");
  const module=new WebAssembly.Module(code),imports=WebAssembly.Module.imports(module),exports=WebAssembly.Module.exports(module);
  if(imports.length<1||imports.length>2||imports[0].module!=="env"||imports[0].name!=="memory"||imports[0].kind!=="memory"||imports.length===2&&(imports[1].module!=="env"||!(imports[1].name==="table"&&imports[1].kind==="table"||imports[1].name==="service"&&imports[1].kind==="function")))throw Error("Unexpected compiled RFE imports");

// Synchronous dispatch packets use the same extent checks without allocating
// an iovec array and packet view for each bounded compiled scheduling session.
function callJIT(f,entry,state,context){

}
function imports(){return {renvo_rfe:{gates},wasi_snapshot_preview1:{
 fd_write(fd,at,count,written){const f=fds.get(fd);if(f?.service){if(count===1){const v=view(),p=v.getUint32(at,true),n=v.getUint32(at+4,true),size=memory.buffer.byteLength;if(p>size||n>size-p)throw Error("Invalid WASI iovec");if(n===16&&v.getUint32(p,true)===2){const entry=v.getUint32(p+4,true),state=v.getUint32(p+8,true),context=v.getUint32(p+12,true);callJIT(f,entry,state,context);f.reply=null;view().setUint32(written,16,true);return 0}}const n=jitRequest(f,iovs(at,count));view().setUint32(written,n,true);return 0}if(fd!==1&&fd!==2)return 8;let n=0;for(const part of iovs(at,count)){output+=decode.decode(part,{stream:true});n+=part.length}view().setUint32(written,n,true);if(fd===2||output.length>=65536)flush();return 0},
 fd_read(fd,at,count,used){const f=fds.get(fd);if(f?.service&&count===1&&f.reply){const v=view(),p=v.getUint32(at,true),n=v.getUint32(at+4,true),size=memory.buffer.byteLength;if(p>size||n>size-p)throw Error("Invalid WASI iovec");if(n>=4){v.setUint32(p,f.replyView.getUint32(0,true),true);f.reply=null;v.setUint32(used,4,true);return 0}}return readFD(fd,at,count,used)},

 fd_readdir:()=>54,

function fail(error){done=true;flush();postMessage({type:"state",state:"failed",error:String(error&&error.stack||error)})}
const schedule=new MessageChannel();
schedule.port1.onmessage=()=>{if(done)return;try{instance.exports.renvo_browser_step();flush();schedule.port2.postMessage(0)}catch(e){flush();if(e&&e.wasiExit){done=true;postMessage({type:"state",state:e.code===0?"halted":"failed",exitCode:e.code})}else fail(e)}};
onmessage=async({data})=>{
 if(data.type==="input"){const b=new Uint8Array(data.bytes);if(inputBytes+b.length<=4096){input.push(b);inputBytes+=b.length}return}

 try{
  args=data.shell?["rfe","-shell"]:["rfe"];
  files.set("kernel",new Uint8Array(data.kernel));files.set("initramfs.cpio.gz",new Uint8Array(data.initrd));
  const built=await WebAssembly.instantiate(data.wasm,imports());instance=built.instance;memory=instance.exports.memory;

  initializing=false;

  files.clear();for(const [fd,file] of fds)if(!file.service)fds.delete(fd);flush();postMessage({type:"state",state:"running"});schedule.port2.postMessage(0);

<script>
"use strict";
const wasm64="@@WASM@@",terminal=document.getElementById("terminal"),status=document.getElementById("status"),encoder=new TextEncoder();
let worker=null,renderPending=false;
function render(){if(renderPending)return;renderPending=true;requestAnimationFrame(()=>{renderPending=false;terminal.textContent=window.renvoBrowserResult.output;window.scrollTo(0,document.body.scrollHeight)})}
window.renvoBrowserResult={state:"idle",exitCode:null,error:null,output:""};
function state(value,extra={}){Object.assign(window.renvoBrowserResult,{state:value},extra);status.textContent=value;document.getElementById("stop").disabled=!worker}
function stop(){if(worker)worker.terminate();worker=null;document.getElementById("boot").disabled=false;document.getElementById("stop").disabled=true}
async function boot(kernel,initrd){if(worker)throw Error("Machine already running");terminal.textContent="";window.renvoBrowserResult={state:"loading",exitCode:null,error:null,output:""};
 const raw=atob(wasm64),wasm=Uint8Array.from(raw,c=>c.charCodeAt(0)).buffer;
 const url=URL.createObjectURL(new Blob([document.getElementById("worker-code").textContent],{type:"text/javascript"}));
 worker=new Worker(url);URL.revokeObjectURL(url);document.getElementById("boot").disabled=true;
 worker.onmessage=({data})=>{if(data.type==="output"){window.renvoBrowserResult.output+=data.text;render()}else if(data.type==="state"){state(data.state,{exitCode:data.exitCode??null,error:data.error??null});if(data.state==="halted"||data.state==="failed")stop()}};
 worker.onerror=e=>{state("failed",{error:e.message});stop()};state("loading");
 worker.postMessage({type:"boot",wasm,kernel,initrd,shell:document.getElementById("shell").checked},[wasm,kernel,initrd]);terminal.focus()
}
document.getElementById("boot").onclick=async()=>{try{const k=document.getElementById("kernel").files[0],i=document.getElementById("initrd").files[0];if(!k||!i)throw Error("Select both a kernel and initramfs");await boot(await k.arrayBuffer(),await i.arrayBuffer())}catch(e){state("failed",{error:String(e)});stop()}};
document.getElementById("stop").onclick=()=>{stop();state("stopped")};
function send(text){if(worker){const bytes=encoder.encode(text);worker.postMessage({type:"input",bytes:bytes.buffer},[bytes.buffer])}}
terminal.onkeydown=e=>{let text=e.key.length===1?e.key:({Enter:"\r",Backspace:"\x7f",Tab:"\t",ArrowUp:"\x1b[A",ArrowDown:"\x1b[B",ArrowRight:"\x1b[C",ArrowLeft:"\x1b[D"})[e.key];if(e.ctrlKey&&e.key.length===1)text=String.fromCharCode(e.key.toUpperCase().charCodeAt(0)&31);if(text){e.preventDefault();send(text)}};
terminal.onpaste=e=>{e.preventDefault();send(e.clipboardData.getData("text"))};
// The offline validator serves only these two checksum-verified local assets.
if(new URLSearchParams(location.search).get("boot")==="1"){
 Promise.all(["kernel","initramfs.cpio.gz"].map(async name=>{const r=await fetch(name);if(!r.ok)throw Error("Missing boot asset: "+name);return r.arrayBuffer()})).then(([k,i])=>boot(k,i)).catch(e=>{state("failed",{error:String(e)});stop()})
}
</script></body></html>
