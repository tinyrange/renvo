name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  preflight:
    name: Generated source and package preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Run preflight
        run: ./tools/check preflight

  backend-amd64:
    name: Backend compiler tests (linux-amd64)
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install QEMU user emulators
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user

      - name: Install Wasmtime
        run: |
          curl -fsSL https://wasmtime.dev/install.sh | bash
          echo "$HOME/.wasmtime/bin" >> "$GITHUB_PATH"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore compiler test cache
        uses: actions/cache@v5
        with:
          path: backend/.renvo/test-cache
          key: renvo-test-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'backend/compiler*.go', 'backend/renvo_main.go', 'backend/tests/*.go', 'backend/unit_frontend_test.go', 'backend/test_cache_test.go') }}
          restore-keys: |
            renvo-test-v2-${{ runner.os }}-${{ runner.arch }}-

      - name: Build backend
        run: |
          go build -o "$RUNNER_TEMP/renvo-backend" ./backend

      - name: Run deterministic VM backend gates
        run: go test -count=1 -timeout 5m -run '^(TestVM32FullBackendSuite|TestVM32SelfHostedBackend)$' ./backend

      - name: Run backend tests
        env:
          RENVO_CROSS_ARCH_TESTS: "1"
        run: |
          tests="$(go test -list '^Test' ./backend | grep '^Test' | grep -v '^TestCompilerPerformance$' | grep -v '^TestCompilerPerformanceWASI$' | grep -v '^TestCompilerResourceGates$' | grep -v '^TestFrontendCompilerPerformance$' | grep -v '^TestVM32FullBackendSuite$' | grep -v '^TestVM32SelfHostedBackend$' | paste -sd'|' -)"
          go test -count=1 -timeout 30m -run "^(${tests})$" ./backend

  backend-arm64:
    name: Backend compiler tests (linux-arm64)
    needs: preflight
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore compiler test cache
        uses: actions/cache@v5
        with:
          path: backend/.renvo/test-cache
          key: renvo-test-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'backend/compiler*.go', 'backend/renvo_main.go', 'backend/tests/*.go', 'backend/unit_frontend_test.go', 'backend/test_cache_test.go') }}
          restore-keys: |
            renvo-test-v2-${{ runner.os }}-${{ runner.arch }}-

      - name: Build backend
        run: |
          go build -o "$RUNNER_TEMP/renvo-backend" ./backend

      - name: Run backend tests
        run: |
          tests="$(go test -list '^Test' ./backend | grep '^Test' | grep -v '^TestCompilerPerformance$' | grep -v '^TestCompilerPerformanceWASI$' | grep -v '^TestCompilerResourceGates$' | grep -v '^TestFrontendCompilerPerformance$' | paste -sd'|' -)"
          go test -count=1 -timeout 30m -run "^(${tests})$" ./backend

      - name: Run native compiler JIT tests
        run: go test -count=1 -timeout 15m ./internal/runimage ./internal/driver ./internal/backendjit ./internal/difftest

  backend-darwin-arm64:
    name: Backend compiler tests (darwin-arm64)
    needs: preflight
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore compiler test cache
        uses: actions/cache@v5
        with:
          path: backend/.renvo/test-cache
          key: renvo-test-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'backend/compiler*.go', 'backend/renvo_main.go', 'backend/tests/*.go', 'backend/unit_frontend_test.go', 'backend/test_cache_test.go') }}
          restore-keys: |
            renvo-test-v2-${{ runner.os }}-${{ runner.arch }}-

      - name: Build backend
        run: |
          go build -o "$RUNNER_TEMP/renvo-backend" ./backend

      - name: Run backend tests
        run: |
          tests="$(go test -list '^Test' ./backend | grep '^Test' | grep -v '^TestCompilerPerformance$' | grep -v '^TestCompilerPerformanceWASI$' | grep -v '^TestCompilerResourceGates$' | grep -v '^TestFrontendCompilerPerformance$' | paste -sd'|' -)"
          go test -count=1 -timeout 30m -run "^(${tests})$" ./backend

      - name: Run Darwin frontend corpus
        run: go test -count=1 -timeout 30m ./frontend_tests

  windows-e2e:
    name: Windows targets (amd64, 386, and arm64 images)
    needs: preflight
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Build, validate, and execute Windows targets
        env:
          RENVO_WINDOWS_GDB: "1"
        run: go test -count=1 -timeout 15m -run '^TestWindows(PEImages|TargetsEndToEnd|GraphicsEndToEnd)$' ./backend

      - name: Run native linked-image REPL session
        env:
          RENVO_WINDOWS_GDB: "1"
        run: go test -count=1 -timeout 15m -run '^TestBundledFrontendNativeREPLSession$' ./frontend_tests

      - name: Run native compiler JIT tests
        run: |
          go test -count=1 -timeout 15m ./internal/runimage ./internal/backendjit ./internal/difftest
          go test -count=1 -timeout 15m -run '^TestRunScriptCommandCompilesImageAndForwardsArguments$' ./internal/driver

  package-tests:
    name: Package tests (macos-14)
    needs: preflight
    runs-on: macos-14
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Run tracked package suites
        run: ./tools/check packages

  performance:
    name: Compiler CI resource gates
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Run shared-runner-safe compiler gates
        run: ./tools/check ci-performance

  frontend-corpus:
    name: Frontend corpus tests
    needs:
      - preflight
      - backend-amd64
      - package-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Run frontend corpus tests
        run: ./tools/check frontend

  required:
    name: Required
    if: ${{ always() }}
    needs:
      - preflight
      - backend-amd64
      - backend-arm64
      - backend-darwin-arm64
      - windows-e2e
      - package-tests
      - performance
      - frontend-corpus
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Require every test job to pass
        run: |
          results=(
            '${{ needs.preflight.result }}'
            '${{ needs.backend-amd64.result }}'
            '${{ needs.backend-arm64.result }}'
            '${{ needs.backend-darwin-arm64.result }}'
            '${{ needs.windows-e2e.result }}'
            '${{ needs.package-tests.result }}'
            '${{ needs.performance.result }}'
            '${{ needs.frontend-corpus.result }}'
          )
          for result in "${results[@]}"; do
            if [[ "$result" != success ]]; then
              echo "A required test job ended with: $result"
              exit 1
            fi
          done
